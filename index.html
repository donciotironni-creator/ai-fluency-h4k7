<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Academy — Skills, MCP & Plugins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/academy.css">
</head>
<body>

<div class="app">

  <!-- ============ HEADER ============ -->
  <header class="appbar">
    <button class="brandbtn" data-action="goto-lesson" data-lesson="1.1">
      <span class="brandmark"></span>
      <span class="brandname">AI Academy</span>
    </button>
    <div class="crumb">
      <span class="cur" id="crumb-module">Modul 1: Bucla 4D &amp; bazele Claude Code</span>
      <span class="sep">›</span>
      <span class="lesson" id="crumb-lesson">Lecția 1.1</span>
    </div>
    <nav class="hdrnav">
      <button class="themebtn lift" id="theme-btn" data-action="toggle-theme" aria-label="Comută tema light/dark">◐</button>
      <button class="hlink" data-action="goto-route" data-route="onboarding">Despre curs</button>
      <button class="cta lift" data-action="goto-lesson" data-lesson="1.1">Începe de aici</button>
    </nav>
  </header>

  <!-- ============ APP BODY ============ -->
  <div class="app-body">

    <!-- LEFT: COURSE SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-eyebrow">CURS AI FLUENCY</div>

      <div id="module-list"></div>

      <div class="sidebar-divider"></div>
      <button class="sidebar-link" data-action="goto-route" data-route="glosar">
        <span style="width:16px;height:14px;border:1.6px solid var(--faint);border-radius:2px;flex:none;display:block"></span>Glosar de termeni
      </button>
      <button class="sidebar-link" data-action="goto-route" data-route="map">
        <span style="width:16px;height:16px;flex:none;position:relative;display:block"><span style="position:absolute;left:0;top:2px;width:5px;height:5px;border-radius:50%;background:var(--faint)"></span><span style="position:absolute;right:0;top:2px;width:5px;height:5px;border-radius:50%;background:var(--faint)"></span><span style="position:absolute;left:5px;bottom:1px;width:5px;height:5px;border-radius:50%;background:var(--faint)"></span></span>Harta conceptelor
      </button>
      <button class="sidebar-link" data-action="goto-route" data-route="resurse">
        <span style="width:15px;height:15px;border:1.6px solid var(--faint);border-radius:50%;flex:none;display:block"></span>Resurse recomandate
      </button>

      <div class="newhere">
        <div class="newhere-hd"><span class="newhere-dot"></span><span class="newhere-title">Nou aici?</span></div>
        <p>Parcurge ghidul rapid și înțelege cum să folosești platforma.</p>
        <button class="tlink" data-action="goto-route" data-route="onboarding">Vezi ghidul (2 min) →</button>
      </div>
    </aside>

    <!-- CENTER + RIGHT -->
    <div class="content-row">
      <main class="scr cmain" id="main-view">
        <div id="view-lesson"></div>
        <div id="view-glossary" style="display:none"></div>
        <div id="view-map" style="display:none"></div>
        <div id="view-onboarding" style="display:none"></div>
        <div id="view-resurse" style="display:none"></div>
      </main>

      <aside class="toc-aside" id="toc-aside">
        <div class="toc-card">
          <div class="toc-title">În această lecție</div>
          <div class="toc-list" id="toc-list"></div>
          <div class="toc-divider"></div>
          <div class="toc-help-label">Ai nevoie de ajutor?</div>
          <span class="toc-help-link" style="cursor:default">Întreabă la sesiunea live</span>
        </div>
      </aside>
    </div>
  </div>
</div>

<script src="assets/academy-data.js"></script>
<script src="assets/academy.js"></script>
</body>
</html>
